<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProxKitty</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #080810;
        color: #f8f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #15152a 0%, #080810 65%);
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .hero {
        text-align: center;
        padding: 2rem 1.25rem 1rem;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 0.75rem;
        border-radius: 24px;
        display: grid;
        place-items: center;
        font-size: 2.5rem;
        background: linear-gradient(135deg, #8257e5, #38bdf8);
        box-shadow: 0 24px 60px rgba(56, 189, 248, 0.35);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.2rem);
      }

      p {
        margin: 0.5rem 0 0;
        color: #cfd2ff;
      }

      .bar {
        display: flex;
        gap: 0.5rem;
        width: min(980px, calc(100vw - 1.5rem));
        margin: 0 auto 1rem;
        background: rgba(14, 14, 30, 0.95);
        border: 1px solid rgba(130, 87, 229, 0.45);
        border-radius: 999px;
        padding: 0.45rem;
      }

      input {
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      input:focus {
        outline: 2px solid #38bdf8;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.8rem 1.25rem;
        background: linear-gradient(135deg, #8257e5, #38bdf8);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      iframe {
        border: none;
        width: min(1200px, calc(100vw - 1.5rem));
        height: clamp(360px, 62vh, 760px);
        margin: 0 auto 1rem;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      }

      .note {
        text-align: center;
        color: #a5b4fc;
        margin: 0 0 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="logo">🐱</div>
      <h1>ProxKitty</h1>
      <p>Single-file static launcher (no Node.js, no public folder).</p>
    </header>

    <form id="launch-form" class="bar">
      <input id="url-input" type="url" placeholder="Enter a URL (example: https://example.com)" required />
      <button type="submit">Open</button>
    </form>

    <iframe id="proxy-frame" title="Website preview" src="about:blank"></iframe>
    <p class="note">Some websites block iframe embedding.</p>

    <script>
      const form = document.getElementById('launch-form');
      const input = document.getElementById('url-input');
      const frame = document.getElementById('proxy-frame');

      const normalizeUrl = (rawInput) => {
        if (!rawInput) return '';
        const trimmed = rawInput.trim();
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      };

      const openTarget = (rawInput) => {
        const target = normalizeUrl(rawInput);
        if (!target) return;
        input.value = target;
        frame.src = target;
      };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        openTarget(input.value);
      });

      const initial = new URL(window.location.href).searchParams.get('url');
      if (initial) openTarget(initial);
    </script>
  </body>
</html>
